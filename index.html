<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jankrats</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav class="rail">
    <div class="wordmark"><span class="glyph">◈</span><span class="name">Jankrats</span></div>
    <div class="wordmark tag" style="margin-top:-14px;">Riftbound collection &amp; deck ledger</div>
    <div class="nav">
      <button data-view="dashboard"><span class="n-icon">⌂</span>Dashboard</button>
      <button data-view="cards"><span class="n-icon">▤</span>Cards</button>
      <button data-view="collection"><span class="n-icon">✦</span>Collection</button>
      <button data-view="friends"><span class="n-icon">◇</span>Friends</button>
      <button data-view="decks"><span class="n-icon">⚔</span>Decks</button>
      <button data-view="import"><span class="n-icon">⇩</span>Import</button>
    </div>
    <div class="rail-stats">
      <div id="social-auth-host"></div>
      <div class="nav profile-nav">
        <button data-view="profile"><span class="n-icon">☺</span>Profile</button>
      </div>
      <div class="profile-field">
        <label>Your name</label>
        <input type="text" id="profile-name" placeholder="Anonymous brewer">
      </div>
    </div>
  </nav>
  <main>
    <div class="view" id="view-dashboard"></div>
    <div class="view" id="view-cards"></div>
    <div class="view" id="view-collection"></div>
    <div class="view" id="view-friends"></div>
    <div class="view" id="view-decks"></div>
    <div class="view" id="view-profile"></div>
    <div class="view" id="view-import"></div>
    <div class="view" id="view-shared"></div>
  </main>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="cards_data.js"></script>
<script src="app.js"></script>
</body>
</html>
