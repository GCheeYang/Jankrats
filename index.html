<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jankrats</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-main">
      <button type="button" class="wordmark" data-view="home" title="Riftbound collection &amp; deck ledger"><img class="glyph" src="assets/logo.png" alt=""><span class="name">Jankrats</span></button>
      <div class="topbar-search-wrap">
        <div class="search-scope">
          Cards
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5 20 20"/></svg>
        <input type="search" id="global-search" placeholder="Search cards, sets, champions…" aria-label="Search cards">
      </div>
      <div class="topbar-right">
        <div id="social-auth-host"></div>
      </div>
    </div>
    <nav class="nav">
      <button data-view="home">Home</button>
      <button data-view="cards">Explore Cards</button>
      <button data-view="collection">Collection</button>
      <button data-view="wanted">Wishlist</button>
      <button data-view="decks">Decks</button>
      <button data-view="friends">Friends</button>
    </nav>
  </header>
  <main>
    <div class="view" id="view-home"></div>
    <div class="view" id="view-dashboard"></div>
    <div class="view" id="view-cards"></div>
    <div class="view" id="view-collection"></div>
    <div class="view" id="view-wanted"></div>
    <div class="view" id="view-friends"></div>
    <div class="view" id="view-decks"></div>
    <div class="view" id="view-profile"></div>
  </main>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="cards_data.js"></script>
<script src="champion_splashes_data.js"></script>
<script src="app.js"></script>
</body>
</html>
