<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jankrats</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-main">
      <div class="wordmark" title="Riftbound collection &amp; deck ledger"><img class="glyph" src="assets/logo.png" alt=""><span class="name">Jankrats</span></div>
      <div class="topbar-right">
        <div id="social-auth-host"></div>
        <input type="text" id="profile-name" class="profile-name-input" placeholder="Your name" aria-label="Your name">
      </div>
    </div>
    <nav class="nav">
      <button data-view="home"><span class="n-icon">⌂</span>Home</button>
      <button data-view="cards"><span class="n-icon">▤</span>Explore Cards</button>
      <button data-view="collection"><span class="n-icon">✦</span>Collection</button>
      <button data-view="friends"><span class="n-icon">◇</span>Friends</button>
      <button data-view="decks"><span class="n-icon">⚔</span>Decks</button>
      <button data-view="import"><span class="n-icon">⇩</span>Import</button>
      <button data-view="dashboard"><span class="n-icon">▦</span>Dashboard</button>
    </nav>
  </header>
  <main>
    <div class="view" id="view-home"></div>
    <div class="view" id="view-dashboard"></div>
    <div class="view" id="view-cards"></div>
    <div class="view" id="view-collection"></div>
    <div class="view" id="view-friends"></div>
    <div class="view" id="view-decks"></div>
    <div class="view" id="view-profile"></div>
    <div class="view" id="view-import"></div>
    <div class="view" id="view-shared"></div>
  </main>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="cards_data.js"></script>
<script src="champion_splashes_data.js"></script>
<script src="app.js"></script>
</body>
</html>
