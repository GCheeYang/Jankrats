name: Apply database schema

# Runs supabase/schema.sql against the live project whenever it changes on
# main, so schema edits no longer need a manual paste into the Supabase SQL
# editor. schema.sql is written to be safe to re-run (every statement is
# "if not exists" / "or replace" / "drop ... if exists"). Uses the same
# SUPABASE_ACCESS_TOKEN as the Edge Functions deploy, via the Management
# API's SQL endpoint -- no database password or connection string needed.
# Also runnable by hand from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
    paths:
      - "supabase/schema.sql"
  workflow_dispatch: {}

concurrency:
  group: apply-schema
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply schema.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: tatghpukfjsbcaktvbms
        run: |
          jq -Rs '{query: .}' supabase/schema.sql > payload.json
          curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @payload.json
          echo
          echo "supabase/schema.sql applied."
