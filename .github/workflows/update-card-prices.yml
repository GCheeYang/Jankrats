name: Update card prices

on:
  schedule:
    # tcgcsv rebuilds its TCGplayer mirror once a day at ~20:05 UTC (see
    # tcgcsv.com/docs) -- run just after so each run picks up the fresh
    # build instead of the previous day's.
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  update-prices:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/price-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/price-scraper/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Fetch and upsert prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node fetch-prices.js
